name: test
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload coverage to Codecov with OIDC instead of a token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make coverage
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.out
          fail_ci_if_error: true
